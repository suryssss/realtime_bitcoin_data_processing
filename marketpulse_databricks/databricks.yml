# This is a Declarative Automation Bundle definition for marketpulse_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: marketpulse_databricks
  uuid: 5b5941f5-6720-4842-a870-52d839e837b4

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4cc5c7f9-4515.cloud.databricks.com?w=7474652040324951
    variables:
      catalog: marketpulse
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-4cc5c7f9-4515.cloud.databricks.com?w=7474652040324951
      # We explicitly deploy to /Workspace/Users/surya.rithwik2005@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/surya.rithwik2005@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: marketpulse
      schema: prod
    permissions:
      - user_name: surya.rithwik2005@gmail.com
        level: CAN_MANAGE
