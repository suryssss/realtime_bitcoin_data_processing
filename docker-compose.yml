version: "3.8"

services:
  marketpulse-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketpulse-ingestion
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PRODUCTS=${PRODUCTS:-BTC-USD,ETH-USD,SOL-USD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

